syntax = "proto3";

package common.v1;

// GiftSpin contains promotional offer counters, lifecycle status and selected mode.
// Availability and paused mode are separate from the funding of an accepted round.
//
// GiftSpin содержит счётчики промо-оффера, статус жизненного цикла и выбранный режим.
// Доступность и режим паузы отделены от финансирования принятого раунда.
message GiftSpin {
  // bet contains the assigned gift stake in the integration's bet units.
  //
  // bet содержит назначенную подарочную ставку в единицах интеграции.
  int64 bet = 1;

  // total_bet contains the accumulated nominal stake reported for this series.
  // It does not represent a debit from the player's main balance.
  //
  // total_bet содержит накопленную номинальную сумму ставок серии по данным сервера.
  // Это не списание с основного баланса игрока.
  int64 total_bet = 2;

  // total_win contains the accumulated series win, including attributed bonuses.
  // Its presence does not request another credit to the balance.
  //
  // total_win содержит накопленный выигрыш серии, включая относящиеся к ней бонусы.
  // Наличие поля не запрашивает повторное зачисление на баланс.
  int64 total_win = 3;

  // left counts remaining gift rounds; zero alone does not finish an ongoing bonus.
  //
  // left считает оставшиеся подарочные раунды; один лишь ноль не завершает текущий бонус.
  int32 left = 4;

  // total contains the granted gift-round count reported for the series.
  //
  // total содержит число выданных подарочных раундов серии по данным сервера.
  int32 total = 5;

  // status contains the offer lifecycle value, including new, started, finished or deleted.
  // It is independent of paused; a terminal response can retain final counters and win.
  //
  // status содержит состояние оффера, включая new, started, finished или deleted.
  // Оно не зависит от paused; терминальный ответ может сохранять итоговые счётчики и выигрыш.
  string status = 6;

  // is_previous_gift is retained for legacy/debug payloads. It is not the selected-mode authority.
  //
  // is_previous_gift сохранён для старых/отладочных данных. Это не источник выбранного режима.
  bool is_previous_gift = 7 [deprecated = true];

  // paused confirms the selected mode: true means balance play, false means gift play.
  // Absence leaves the mode unknown; it must not be interpreted as false.
  //
  // paused подтверждает выбранный режим: true означает баланс, false означает гифты.
  // При отсутствии поля режим неизвестен; отсутствие не трактуется как false.
  optional bool paused = 8;
}
