syntax = "proto3";

package api.base.v1;

import "common/v1/gift_spin.proto";
import "common/v1/user.proto";

// API responses for game actions (start, spin, sync, error)
message SyncResponse {
  // user contains the details of the logged-in user, including balance and currency.
  common.v1.User user = 1;

  // gift_spin contains the offer and its confirmed paused mode.
  // Receiving an offer does not start a round or resume gift play.
  //
  // gift_spin содержит оффер и его подтверждённый режим paused.
  // Получение оффера не запускает раунд и не возобновляет игру на гифты.
  common.v1.GiftSpin gift_spin = 2;
}
