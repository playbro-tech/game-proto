syntax = "proto3";

package api.base.v1;

import "common/v1/gift_spin.proto";
import "common/v1/user.proto";

// API response for login action
message LoginResponse {
  // user contains the details of the logged-in user.
  common.v1.User user = 1;

  // sign_key is a unique key used for signing requests, ensuring secure communication between the client and server.
  string sign_key = 2;

  // gift_spin contains the available offer and its confirmed paused mode.
  // An available offer does not itself request a round.
  //
  // gift_spin содержит доступный оффер и его подтверждённый режим paused.
  // Само наличие оффера не запрашивает раунд.
  common.v1.GiftSpin gift_spin = 3;
}
